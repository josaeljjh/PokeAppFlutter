name: poke_app
description: PokeApp migrada de Android nativo a Flutter (Clean Architecture).

publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
#localization
  flutter_localizations:
    sdk: flutter

  design_system:
    path: ./design_system

  sqflite: ^2.3.0
  path: ^1.9.0
  get_it: ^7.6.4
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  internet_connection_checker: ^1.0.0+1
  dio: ^5.3.3
  shared_preferences: ^2.2.1
  share_plus: ^7.1.0
  json_annotation: ^4.8.1
  freezed_annotation: ^3.0.0
  awesome_dio_interceptor: ^1.0.0
  localization: ^2.1.0
  logarte: ^0.2.1

  #Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  #UI
  cupertino_icons: ^1.0.6
  responsive_framework: ^1.1.1
  cached_network_image: ^3.3.0
  flutter_animate: ^4.2.0+1

  collection: ^1.18.0

  #Utils
  intl: ^0.20.2
  device_preview: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.3
  flutter_launcher_icons: ^0.13.1
  json_serializable: ^6.7.1
  build_runner: ^2.4.10
  freezed: ^3.0.6
  mocktail: ^1.0.4
  bloc_test: ^9.1.7


#Icons
flutter_icons:
  ios: true
  android: true
  image_path: "res/launcher/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "res/launcher/app_icon_foreground.png"

#Resources
flutter:
  uses-material-design: true

  assets:
    - res/i18n/
